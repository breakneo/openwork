name: Evidence review

# Publication runs after existing checks, on its own workflow. Never require
# this check in branch protection: storage and presentation do not gate shipping.
on:
  pull_request:
    paths:
      - apps/review/**
      - packages/review/**
      - evals/packages/test-artifacts/**
      - evals/scripts/publish-review*.mjs
      - evals/specs/evidence-review.test.ts
      - evals/worlds/evidence-review.ts
      - .github/workflows/evidence-review.yml
  workflow_dispatch:
    inputs:
      run_id:
        description: "Completed Build and core checks or Product journeys run to publish (current open PR head only)"
        required: true
        type: string
  workflow_run:
    workflows: [Build and core checks, Product journeys]
    types: [completed]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  # Required-check controllers must not displace unrelated pending completions.
  group: evidence-review-${{ github.event_name }}-${{ github.event.workflow_run.id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required-verification:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Product journeys' && github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Reconcile the authenticated current-head plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/required-verification-controller.mjs complete
  check-publisher:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install only publisher dependencies
        run: |
          pnpm --filter @openwork/review... install --frozen-lockfile --ignore-scripts
          pnpm --dir evals --filter @openwork/test-artifacts install --frozen-lockfile --ignore-scripts
      - name: Test publisher without publishing credentials or journey infrastructure
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=publisher-contracts.xml evals/packages/test-artifacts/test/*.test.ts evals/scripts/publish-review.test.mjs
      - name: Save candidate publisher verification (synthetic inputs only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publisher-contracts
          path: publisher-contracts.xml
          retention-days: 7
          if-no-files-found: warn
  check-app:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install review and testkit dependencies
        run: |
          pnpm --filter @openwork/review-app... --filter @openwork/world... --filter @openwork/types... install --frozen-lockfile --ignore-scripts
          pnpm --dir evals install --frozen-lockfile --ignore-scripts
      - name: Build and verify the review app
        env:
          OPENWORK_EVAL_REVIEW: "1"
        run: |
          pnpm --filter @openwork/review-app build
          node --test evals/bin/evals.test.mjs
          pnpm evals:pr specs/evidence-review.test.ts
      - name: Save review journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-app-evidence
          path: evals/results/test-runs/
          retention-days: 7
  publish:
    needs: required-verification
    # Only optional presentation is serialized across producer runs.
    concurrency:
      group: evidence-review-publish-${{ github.repository }}
      cancel-in-progress: false
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_run') &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: write
    steps:
      # Only trusted default-branch code runs with the publishing credentials.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install publisher dependencies
        run: |
          pnpm --filter @openwork/review... install --frozen-lockfile --ignore-scripts
          pnpm --dir evals --filter @openwork/test-artifacts install --frozen-lockfile --ignore-scripts
      - name: Read completed evidence and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.OPENWORK_REVIEW_BLOB_TOKEN }}
          OPENWORK_REVIEW_URL: ${{ vars.OPENWORK_REVIEW_URL }}
          REVIEW_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node evals/scripts/publish-review.mjs
